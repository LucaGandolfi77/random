name: CI quality gates

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backend install
        working-directory: ecss-ml-assurance-workbench/backend
        run: pip install -r requirements.txt
      - name: Backend lint & type
        working-directory: ecss-ml-assurance-workbench/backend
        run: |
          ruff check app tests
          mypy app
      - name: Backend tests
        working-directory: ecss-ml-assurance-workbench/backend
        run: python -m pytest tests -q
      - name: Root enforcement
        run: python ecss-ml-assurance-workbench/backend/app/scripts/check_root.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend install
        working-directory: ecss-ml-assurance-workbench/frontend
        run: npm ci
      - name: Frontend lint, types, content, tests
        working-directory: ecss-ml-assurance-workbench/frontend
        run: |
          npm run lint
          npx tsc --noEmit
          node scripts/validate-content.mjs
          npm test
      - name: Production build
        working-directory: ecss-ml-assurance-workbench/frontend
        run: npm run build
