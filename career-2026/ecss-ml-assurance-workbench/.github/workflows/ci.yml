name: CI quality gates

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backend install
        working-directory: ecss-ml-assurance-workbench/backend
        run: pip install -r requirements.txt
      - name: Backend lint & type
        working-directory: ecss-ml-assurance-workbench/backend
        run: |
          ruff check app tests
          mypy app
      - name: Python bandit security scan
        working-directory: ecss-ml-assurance-workbench/backend
        run: bandit -r app -ll
      - name: Backend tests
        working-directory: ecss-ml-assurance-workbench/backend
        run: |
          pip install redis
          redis-server --daemonize yes
          python -m pytest tests -q
        env:
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
      - name: Root enforcement
        run: python ecss-ml-assurance-workbench/backend/app/scripts/check_root.py
      - name: Snyk Python vulnerability scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend install
        working-directory: ecss-ml-assurance-workbench/frontend
        run: npm ci
      - name: npm audit security scan
        working-directory: ecss-ml-assurance-workbench/frontend
        run: npm audit --audit-level=moderate
      - name: Snyk Node.js vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - name: Frontend lint, types, content, tests
        working-directory: ecss-ml-assurance-workbench/frontend
        run: |
          npm run lint
          npx tsc --noEmit
          node scripts/validate-content.mjs
          npm test
          npm run test:accessibility
      - name: Production build
        working-directory: ecss-ml-assurance-workbench/frontend
        run: npm run build
