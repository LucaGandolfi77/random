[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-translator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "requests",
]

[project.scripts]
meowtranslate = "cat_translator.cli:main"

[tool.setuptools.packages.find]
include = ["cat_translator*"]
