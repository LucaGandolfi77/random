<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e; color: #eee; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #16213e; border-radius: 1.5rem; padding: 2.5rem;
    max-width: 520px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    text-align: center;
  }
  h1 { font-size: 1.8rem; margin-bottom: .5rem; }
  h1 span { display: inline-block; }
  .subtitle { color: #888; margin-bottom: 2rem; }
  .drop-zone {
    border: 2px dashed #444; border-radius: 1rem; padding: 2rem;
    cursor: pointer; transition: all .2s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #e94560; background: #1a1a3e;
  }
  .drop-zone p { color: #888; }
  .drop-zone input[type=file] { display: none; }
  .btn {
    background: #e94560; color: #fff; border: none;
    padding: .7rem 1.5rem; border-radius: 2rem; font-size: 1rem;
    cursor: pointer; transition: background .2s; margin-top: 1rem;
  }
  .btn:hover { background: #d63851; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .result {
    margin-top: 2rem; padding: 1.5rem; border-radius: 1rem;
    display: none; background: #0f3460;
  }
  .result .intent {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .1em;
    color: #888; margin-bottom: .5rem;
  }
  .result .phrase { font-size: 1.3rem; line-height: 1.5; margin-bottom: .5rem; }
  .result .confidence { font-size: .8rem; color: #888; }
  .record-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #333; }
  .record-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: #e94560; border: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .record-btn.recording {
    background: #ff4444; animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .record-btn svg { width: 20px; height: 20px; fill: #fff; }
  .loading { margin-top: 1rem; color: #888; }
  .error { color: #ff6b6b; margin-top: 1rem; }
</style>
</head>
<body>
<div class="card">
  <h1>🐱 <span>Cat Translator</span></h1>
  <p class="subtitle">Traduci i miagolii del tuo gatto in italiano</p>

  <div class="drop-zone" id="dropZone">
    <p>📂 Clicca o trascina un file .wav qui</p>
    <input type="file" id="fileInput" accept=".wav,audio/wav">
  </div>
  <button class="btn" id="translateBtn" disabled>Traduci</button>

  <div class="record-section">
    <button class="record-btn" id="recordBtn" title="Registra dal microfono">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <p style="font-size:.8rem;color:#888;margin-top:.5rem">Registra dal microfono</p>
  </div>

  <div class="result" id="result">
    <div class="intent" id="resultIntent"></div>
    <div class="phrase" id="resultPhrase"></div>
    <div class="confidence" id="resultConfidence"></div>
  </div>
  <div class="loading" id="loading" style="display:none">Traduzione in corso...</div>
  <div class="error" id="error" style="display:none"></div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const translateBtn = document.getElementById('translateBtn');
const resultDiv = document.getElementById('result');
const resultIntent = document.getElementById('resultIntent');
const resultPhrase = document.getElementById('resultPhrase');
const resultConfidence = document.getElementById('resultConfidence');
const loading = document.getElementById('loading');
const errorDiv = document.getElementById('error');
const recordBtn = document.getElementById('recordBtn');

let selectedFile = null;
let mediaRecorder = null;
let recordingChunks = [];
let isRecording = false;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleFile(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (!file.name.endsWith('.wav') && file.type !== 'audio/wav') {
    showError('Per favore carica un file .wav');
    return;
  }
  selectedFile = file;
  dropZone.innerHTML = `<p>✅ ${file.name} (${(file.size/1024).toFixed(1)} KB)</p>`;
  translateBtn.disabled = false;
  hideError();
}

translateBtn.addEventListener('click', translateFile);

async function translateFile() {
  if (!selectedFile) return;
  const formData = new FormData();
  formData.append('file', selectedFile);
  showLoading();
  hideError();
  try {
    const res = await fetch('/api/translate', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    showResult(data);
  } catch (e) {
    showError('Errore di connessione: ' + e.message);
  } finally {
    hideLoading();
  }
}

recordBtn.addEventListener('click', async () => {
  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.classList.remove('recording');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    recordingChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordingChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recordingChunks, { type: 'audio/webm' });
      const file = new File([blob], 'recording.webm', { type: 'audio/webm' });
      selectedFile = file;
      dropZone.innerHTML = `<p>🎤 Registrazione (${(blob.size/1024).toFixed(1)} KB)</p>`;
      translateBtn.disabled = false;
      translateFile();
    };
    mediaRecorder.start();
    isRecording = true;
    recordBtn.classList.add('recording');
  } catch (err) {
    showError('Microfono non accessibile: ' + err.message);
  }
});

function showResult(data) {
  resultIntent.textContent = data.intent;
  resultPhrase.textContent = data.phrase;
  resultConfidence.textContent = `Confidenza: ${(data.confidence * 100).toFixed(0)}%`;
  resultDiv.style.display = 'block';
}
function showLoading() { loading.style.display = 'block'; }
function hideLoading() { loading.style.display = 'none'; }
function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; }
function hideError() { errorDiv.style.display = 'none'; }
</script>
</body>
</html>
