<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a0e08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#2a1a10"/>
  <circle cx="256" cy="280" r="180" fill="url(#glow)"/>
  <!-- oven body -->
  <rect x="120" y="200" width="272" height="200" rx="20" fill="#5a3a20" stroke="#8B4513" stroke-width="4"/>
  <!-- oven door -->
  <rect x="160" y="240" width="192" height="120" rx="12" fill="#3a2a18" stroke="#6a4a30" stroke-width="3"/>
  <!-- fire -->
  <ellipse cx="210" cy="340" rx="16" ry="24" fill="#e74c3c"/>
  <ellipse cx="256" cy="330" rx="20" ry="30" fill="#e67e22"/>
  <ellipse cx="302" cy="340" rx="16" ry="24" fill="#e74c3c"/>
  <!-- flames top -->
  <ellipse cx="230" cy="310" rx="8" ry="16" fill="#f1c40f" opacity="0.8"/>
  <ellipse cx="256" cy="300" rx="10" ry="20" fill="#f1c40f" opacity="0.9"/>
  <ellipse cx="282" cy="310" rx="8" ry="16" fill="#f1c40f" opacity="0.8"/>
  <!-- chimney -->
  <rect x="220" y="140" width="72" height="70" rx="8" fill="#5a3a20" stroke="#8B4513" stroke-width="3"/>
  <!-- smoke -->
  <circle cx="240" cy="120" r="12" fill="#888" opacity="0.4"/>
  <circle cx="260" cy="100" r="16" fill="#888" opacity="0.3"/>
  <circle cx="250" cy="80" r="10" fill="#888" opacity="0.2"/>
  <!-- bread -->
  <ellipse cx="256" cy="220" rx="40" ry="14" fill="#d4a056"/>
  <ellipse cx="256" cy="215" rx="35" ry="10" fill="#e6c88a"/>
  <!-- text -->
  <text x="256" y="460" text-anchor="middle" fill="#f5e6d3" font-family="serif" font-size="48" font-weight="bold">F&amp;F</text>
</svg>
