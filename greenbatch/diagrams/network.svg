<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .tb{font-size:14px;font-weight:700;fill:#12212e}
      .lbl{font-size:11.5px;font-weight:700;fill:#12212e}
      .ts{font-size:9.5px;fill:#4a5b6c}
      .box{fill:#fff;stroke:#33475b;stroke-width:1.4}
      .boxF{fill:#eef3f8;stroke:#33475b;stroke-width:1.4}
      .wire{stroke:#2b6cb0;stroke-width:2.4;fill:none}
      .field{stroke:#7a8a99;stroke-width:2;fill:none;stroke-dasharray:6 4}
      .zoneE{fill:#f5f9ff;stroke:#2b6cb0;stroke-width:1.4;stroke-dasharray:6 4}
      .zoneD{fill:#fffaf0;stroke:#c05621;stroke-width:1.4;stroke-dasharray:6 4}
      .zoneO{fill:#f0fff6;stroke:#38a169;stroke-width:1.4;stroke-dasharray:6 4}
      .zoneF{fill:#faf5ff;stroke:#805ad5;stroke-width:1.4;stroke-dasharray:6 4}
      .fw{fill:#c53030;stroke:#c53030}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2b6cb0"/></marker>
    <marker id="afw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c53030"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#fbfdff"/>
  <rect x="20" y="14" width="1360" height="46" rx="6" class="box"/>
  <text x="36" y="36" class="tb">GreenBatch GB-8S — architettura di rete OT/IT (zone e condotti IEC 62443)</text>
  <text x="36" y="52" class="ts">Disegno GB-8S-NET-001 · rev. A · segmentazione in zone, flussi solo attraverso conduit controllati</text>

  <!-- ZONA ENTERPRISE -->
  <rect x="40" y="80" width="1320" height="120" class="zoneE" rx="10"/>
  <text x="56" y="102" class="lbl">ZONA 4 — Enterprise / IT (cloud, ufficio)</text>
  <rect x="80" y="118" width="200" height="60" class="boxF"/><text x="92" y="142" class="ts">ERP / MES torrefazione</text><text x="92" y="158" class="ts">ordini, ricette, lotti</text>
  <rect x="320" y="118" width="200" height="60" class="boxF"/><text x="332" y="142" class="ts">Report &amp; BI</text><text x="332" y="158" class="ts">OEE, tracciabilità</text>
  <rect x="560" y="118" width="200" height="60" class="boxF"/><text x="572" y="142" class="ts">Posta / notifiche</text><text x="572" y="158" class="ts">report lotto PDF</text>
  <rect x="800" y="118" width="200" height="60" class="boxF"/><text x="812" y="142" class="ts">Backup cloud</text><text x="812" y="158" class="ts">DB + report firmati</text>

  <!-- ZONA DMZ -->
  <rect x="40" y="230" width="1320" height="140" class="zoneD" rx="10"/>
  <text x="56" y="252" class="lbl">ZONA 3 — DMZ industriale</text>
  <rect x="80" y="272" width="230" height="72" class="boxF"/>
  <text x="92" y="294" class="ts">Gateway OPC UA</text>
  <text x="92" y="310" class="ts">server + client (4840)</text>
  <text x="92" y="326" class="ts">buffer store-and-forward</text>
  <rect x="340" y="272" width="210" height="72" class="boxF"/>
  <text x="352" y="294" class="ts">VPN concentratore</text>
  <text x="352" y="310" class="ts">accesso manutenzione</text>
  <text x="352" y="326" class="ts">MFA + audit</text>
  <rect x="580" y="272" width="210" height="72" class="boxF"/>
  <text x="592" y="294" class="ts">Server report</text>
  <text x="592" y="310" class="ts">PDF firmati, storico</text>
  <text x="592" y="326" class="ts">NAS 2 TB RAID1</text>
  <rect x="820" y="272" width="230" height="72" class="boxF"/>
  <text x="832" y="294" class="ts">Jump host</text>
  <text x="832" y="310" class="ts">sessioni registrate</text>
  <text x="832" y="326" class="ts">no credenziali condivise</text>

  <!-- ZONA OT -->
  <rect x="40" y="400" width="1320" height="220" class="zoneO" rx="10"/>
  <text x="56" y="422" class="lbl">ZONA 2 — Controllo di processo (OT)</text>
  <rect x="90" y="446" width="220" height="86" class="boxF"/>
  <text x="102" y="468" class="lbl">PLC S7-1512SP</text>
  <text x="102" y="486" class="ts">FB_Silo ×8 · FB_Diverter</text>
  <text x="102" y="502" class="ts">FB_VacuumLine · FB_Weigher</text>
  <text x="102" y="518" class="ts">FB_Batch · FB_Alarm · FB_Trace</text>
  <rect x="340" y="446" width="200" height="86" class="boxF"/>
  <text x="352" y="468" class="lbl">HMI panel PC</text>
  <text x="352" y="486" class="ts">GreenBatch HMI (15")</text>
  <text x="352" y="502" class="ts">login a ruoli, allarmi</text>
  <text x="352" y="518" class="ts">report lotto</text>
  <rect x="570" y="446" width="200" height="86" class="boxF"/>
  <text x="582" y="468" class="lbl">Switch gestito</text>
  <text x="582" y="486" class="ts">PROFINET, anello MRP</text>
  <text x="582" y="502" class="ts">VLAN 10 OT / VLAN 20 DMZ</text>
  <text x="582" y="518" class="ts">port security, syslog</text>
  <rect x="800" y="446" width="200" height="86" class="boxF"/>
  <text x="812" y="468" class="lbl">IO remoti ET200SP</text>
  <text x="812" y="486" class="ts">DI 56 · DQ 33</text>
  <text x="812" y="502" class="ts">AI 4 · AQ 2</text>
  <text x="812" y="518" class="ts">isola valvole 24 V</text>
  <rect x="1030" y="446" width="200" height="86" class="boxF"/>
  <text x="1042" y="468" class="lbl">Postazione engineering</text>
  <text x="1042" y="486" class="ts">TIA Portal / backup</text>
  <text x="1042" y="502" class="ts">solo in modalità locale</text>
  <text x="1042" y="518" class="ts">chiave MODE-LOCAL</text>

  <!-- ZONA FIELD -->
  <rect x="40" y="640" width="1320" height="180" class="zoneF" rx="10"/>
  <text x="56" y="662" class="lbl">ZONA 1 — Campo (sensori e attuatori)</text>
  <rect x="90" y="680" width="230" height="60" class="boxF"/><text x="102" y="704" class="ts">8× WT-20x peso silo</text><text x="102" y="720" class="ts">Modbus RTU 9600 8E1</text>
  <rect x="360" y="680" width="200" height="60" class="boxF"/><text x="372" y="704" class="ts">WT-250 + LC-01..03</text><text x="372" y="720" class="ts">3 celle 100 kg</text>
  <rect x="600" y="680" width="220" height="60" class="boxF"/><text x="612" y="704" class="ts">LS-20xH/L · LSL-151</text><text x="612" y="720" class="ts">livelli 24 VDC</text>
  <rect x="860" y="680" width="220" height="60" class="boxF"/><text x="872" y="704" class="ts">PI-102 · PDT-103 · CT-01</text><text x="872" y="720" class="ts">4-20 mA</text>
  <rect x="1120" y="680" width="200" height="60" class="boxF"/><text x="1132" y="704" class="ts">18+ solenoidi valvole</text><text x="1132" y="720" class="ts">EV/DV · dump di sicurezza</text>
  <text x="90" y="770" class="ts">Cablaggio: cavi schermati per analogiche e Modbus · separazione dalla potenza · guaine e pressacavi IP68 · bonding equipotenziale (zona 22).</text>
  <text x="90" y="792" class="ts">Diagnostica di campo: rottura filo, corto, tempo di manovra valvola fuori tolleranza, drift cella di carico.</text>

  <!-- condotti / flussi -->
  <g>
    <path class="wire" d="M300 178 V272" marker-end="url(#a)"/>
    <text x="308" y="222" class="ts">OPC UA (solo lettura) / SQL su HTTPS</text>
    <path class="wire" d="M195 344 V446" marker-end="url(#a)"/>
    <text x="203" y="400" class="ts">OPC UA 4840 TLS · sola andata verso DMZ</text>
    <path class="fw" d="M0 0" />
    <path d="M420 344 V446" stroke="#c53030" stroke-width="2.2" fill="none" stroke-dasharray="5 4" marker-end="url(#afw)"/>
    <text x="428" y="400" class="ts" fill="#c53030">VPN manutenzione (DMZ→OT) solo con approvazione</text>
    <path class="field" d="M300 532 V680"/>
    <text x="308" y="610" class="ts">PROFINET / IO-Link-ish · 24 V · 4-20 mA · Modbus RTU</text>
  </g>

  <!-- regole -->
  <g transform="translate(40,826)">
    <text x="0" y="14" class="ts">Regole: nessun accesso Internet diretto dalla zona OT · solo OPC UA in uscita verso la DMZ · firewall stateful tra zone · log di audit su tutte le sessioni</text>
    <text x="0" y="30" class="ts">Backup: PLC + HMI + DB ogni notte, conservazione 30 giorni · test di ripristino semestrale · NTP interno per timestamp coerenti dei lotti</text>
  </g>
</svg>
