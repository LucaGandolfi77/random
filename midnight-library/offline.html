<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141834">
  <title>Offline — Lumina</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #141834; color: #f5ead7;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    h1 { color: #f0b96b; letter-spacing: .06em; }
    p { color: #cfc4b3; max-width: 36ch; line-height: 1.55; }
    a.btn {
      display: inline-block; margin-top: 14px; padding: 12px 22px;
      background: #f0b96b; color: #141834; text-decoration: none;
      border-radius: 999px; font-weight: 700;
    }
    .dim { font-size: .85rem; opacity: .75; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sei offline — ma la biblioteca è qui.</h1>
    <p>La prima volta che entri, tutto resta disponibile senza rete. Torna quando vuoi: le lanterne ti aspettano.</p>
    <p lang="en">You're offline — but the library is here. Everything stays available after the first visit.</p>
    <a class="btn" href="./index.html">Torna alla biblioteca</a>
    <p class="dim">Lumina · La Biblioteca di Mezzanotte</p>
  </main>

</html>
