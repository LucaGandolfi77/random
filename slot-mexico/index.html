<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌮 Lotería Mexicana - Slot 5×5</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header>
      <h1>🌮 Lotería <span class="hl">Mexicana</span></h1>
      <p class="subtitle">Gira e vinci come un vero <em>mariachi</em>!</p>
    </header>

    <!-- SCOREBOARD -->
    <div class="scoreboard">
      <div class="stat">
        <span class="stat-label">💰 Crediti</span>
        <span class="stat-value" id="credits">1000</span>
      </div>
      <div class="stat">
        <span class="stat-label">🏆 Puntata</span>
        <span class="stat-value" id="bet">100</span>
      </div>
      <div class="stat">
        <span class="stat-label">🎰 Vincita</span>
        <span class="stat-value highlight" id="winDisplay">0</span>
      </div>
    </div>

    <!-- BET CONTROLS -->
    <div class="bet-controls">
      <button class="btn bet-btn" id="betDown" aria-label="Diminuisci puntata">−</button>
      <div class="bet-display">
        <span class="bet-label">PUNTATA</span>
        <span id="betAmount">100</span>
      </div>
      <button class="btn bet-btn" id="betUp" aria-label="Aumenta puntata">+</button>
    </div>

    <!-- SLOT GRID 5×5 -->
    <div class="slot-container">
      <div class="slot-grid" id="slotGrid">
        <!-- 25 cells generated by JS -->
      </div>
    </div>

    <!-- WIN LINES OVERLAY -->
    <div class="lines-overlay" id="linesOverlay"></div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button class="btn spin-btn" id="spinBtn">
        <span class="spin-icon">🎰</span>
        <span class="spin-text">¡Gira!</span>
      </button>
      <button class="btn auto-btn" id="autoBtn">🔄 Auto</button>
    </div>

    <!-- LAST WIN MESSAGE -->
    <div class="win-message" id="winMessage"></div>

    <!-- PAYTABLE -->
    <details class="paytable" id="paytable">
      <summary>📋 Tabella pagamenti</summary>
      <div class="paytable-grid">
        <div class="pay-row"><span>🦜 5× Pappagallo</span><span>500</span></div>
        <div class="pay-row"><span>💀 5× Calavera</span><span>300</span></div>
        <div class="pay-row"><span>🇲🇽 5× Bandiera</span><span>200</span></div>
        <div class="pay-row"><span>🎸 5× Chitarra</span><span>150</span></div>
        <div class="pay-row"><span>🌮 5× Taco</span><span>100</span></div>
        <div class="pay-row"><span>🌶️ 5× Peperoncino</span><span>80</span></div>
        <div class="pay-row"><span>⭐ 4× uguali</span><span>100</span></div>
        <div class="pay-row"><span>⭐ 3× uguali</span><span>15</span></div>
      </div>
    </details>
  </div>

  <script src="script.js"></script>
</body>
</html>
